<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Notion Roadmap Importer</title>
  <desc id="desc">A three-step flow from roadmap JSON through a Node.js importer to a dependency-aware Notion task database.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102A2A"/>
      <stop offset="1" stop-color="#173F3C"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#D9EEE6" stroke-opacity=".055"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#F2A66A"/>
    </marker>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#background)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <circle cx="1080" cy="48" r="100" fill="#80C7AD" opacity=".08"/>
  <text x="54" y="58" fill="#A9D7C6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="2">A ROADMAP, READY TO RUN</text>
  <text x="54" y="101" fill="#F4F4E9" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">From structured tasks to a trackable build.</text>
  <text x="54" y="132" fill="#BED0C9" font-family="Segoe UI, Arial, sans-serif" font-size="15">A resumable import with phases, timelines, priorities and task dependencies.</text>

  <g transform="translate(54 174)">
    <rect width="278" height="78" rx="10" fill="#F4F4E9"/>
    <rect x="16" y="17" width="36" height="44" rx="5" fill="#DDEBE4"/>
    <path d="M25 29h18M25 37h18M25 45h13" stroke="#27796F" stroke-width="3" stroke-linecap="round"/>
    <text x="68" y="34" fill="#163A36" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Roadmap data</text>
    <text x="68" y="55" fill="#55716A" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">tasks.json · 40 items</text>
  </g>
  <path d="M350 213h72" stroke="#F2A66A" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(454 174)">
    <rect width="278" height="78" rx="10" fill="#DCEEE5"/>
    <rect x="17" y="19" width="40" height="40" rx="8" fill="#27796F"/>
    <path d="M28 40h18M37 29v22" stroke="#F4F4E9" stroke-width="3" stroke-linecap="round"/>
    <text x="72" y="34" fill="#163A36" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Node.js importer</text>
    <text x="72" y="55" fill="#55716A" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">checkpoint · retry · resume</text>
  </g>
  <path d="M750 213h72" stroke="#F2A66A" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(854 174)">
    <rect width="292" height="78" rx="10" fill="#F4F4E9"/>
    <rect x="17" y="18" width="40" height="42" rx="7" fill="#171717"/>
    <path d="M27 29h20M27 36h20M27 43h14" stroke="#F4F4E9" stroke-width="2.5" stroke-linecap="round"/>
    <text x="72" y="34" fill="#163A36" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Notion task database</text>
    <text x="72" y="55" fill="#55716A" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">timeline · status · dependencies</text>
  </g>
</svg>